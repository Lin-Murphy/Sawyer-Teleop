<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIBERO Quest Teleop</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11171e; color: #e7eef6; }
  body { margin: auto; max-width: 820px; padding: 24px; }
  h1 { margin: 0 0 14px; font-size: 1.6rem; }
  form, .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
  input, button { font: inherit; padding: 9px 12px; border: 1px solid #52687c; border-radius: 6px; background: #253544; color: inherit; }
  button:not(:disabled) { cursor: pointer; }
  button:disabled { opacity: .45; }
  #start { background: #225846; }
  #stop { background: #633b36; }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  img { display: block; width: 100%; aspect-ratio: 1; background: #202a34; border-radius: 8px; }
  figcaption { margin-top: 6px; }
  #status, #saved { color: #afc2d5; }
  #saved { overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>LIBERO Quest Teleop</h1>
<form id="login">
  <label for="key">Station key</label>
  <input id="key" type="password" required autocomplete="off">
  <button>Connect</button>
</form>
<h2 id="task" hidden></h2>
<p id="status" role="status">Disconnected</p>
<div class="controls">
  <button id="calibrate" disabled>Calibrate heading</button>
  <button id="reset" disabled>Next scene</button>
  <button id="start" disabled>Start recording from reset</button>
  <button id="stop" disabled>Stop and save</button>
</div>
<p id="message" aria-live="polite">Look along the intended Panda +X direction to calibrate. Hold the right grip to move and use the right trigger to close the gripper.</p>
<p id="saved" hidden></p>
<div class="views">
  <figure><img id="agentview_rgb" alt="Scene camera"><figcaption>Scene camera</figcaption></figure>
  <figure><img id="eye_in_hand_rgb" alt="Wrist camera"><figcaption>Wrist camera</figcaption></figure>
</div>
<script>
  const byId = id => document.getElementById(id);
  const controls = ["calibrate", "reset", "start", "stop"];
  const views = ["agentview_rgb", "eye_in_hand_rgb"];
  let key = "";
  let polling = false;
  let pending = false;
  let status = null;

  function updateControls() {
    for (const id of controls) {
      byId(id).disabled = !status || pending ||
        (id === "start" && (status.recording || !status.scene_ready)) ||
        (id === "reset" && status.recording) ||
        (id === "stop" && !status.recording);
    }
  }

  async function request(path, body) {
    const headers = {Authorization: "Bearer " + key};
    const options = {headers, cache: "no-store", signal: AbortSignal.timeout(2000)};
    if (body) {
      headers["Content-Type"] = "application/json";
      options.method = "POST";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    if (!response.ok) throw new Error((await response.json()).error);
    return response;
  }

  async function updateView(id) {
    const image = byId(id);
    const blob = await (await request("/" + id)).blob();
    const old = image.src;
    image.src = URL.createObjectURL(blob);
    if (old.startsWith("blob:")) URL.revokeObjectURL(old);
  }

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const next = await (await request("/status")).json();
      if (!("recording" in next)) {
        byId("status").textContent = next.task;
        return;
      }
      const previousMessage = status?.message;
      status = next;
      byId("task").hidden = false;
      byId("task").textContent = status.task;
      byId("status").textContent = [status.input, status.moving ? "Following" : status.calibrated ? "Calibrated" : "Uncalibrated",
        "Scene " + status.seed, status.recording ? "Recording · " + status.steps + " actions" : "Idle",
        status.task_success ? "Task success reached" : "Task incomplete"].join(" · ");
      if (status.message !== previousMessage) byId("message").textContent = status.message;
      byId("saved").hidden = !status.last_saved;
      byId("saved").textContent = status.last_saved ? "Latest episode " + status.last_saved : "";
      updateControls();
      if (status.scene_ready) {
        await Promise.all(views.map(updateView));
      } else {
        for (const id of views) {
          const image = byId(id);
          if (image.src.startsWith("blob:")) URL.revokeObjectURL(image.src);
          image.removeAttribute("src");
        }
      }
    } catch (error) {
      status = null;
      byId("status").textContent = error.message;
      updateControls();
    } finally {
      polling = false;
    }
  }

  byId("login").onsubmit = event => {
    event.preventDefault();
    key = byId("key").value.trim();
    byId("key").value = "";
    poll();
  };
  for (const command of controls) {
    byId(command).onclick = async () => {
      pending = true;
      updateControls();
      try {
        await request("/command", {command});
      } catch (error) {
        byId("message").textContent = error.message;
      } finally {
        pending = false;
        updateControls();
      }
    };
  }
  setInterval(() => { if (key) poll(); }, 125);
</script>
</body>
</html>
